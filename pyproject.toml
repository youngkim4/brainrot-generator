[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainrot-generator"
version = "0.1.0"
description = "Automated short-form video generator (TikTok/Reels/Shorts)"
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=7.2.7",
    "moviepy>=2.2.1",
    "whisper-timestamped>=1.15.0",
    "Pillow>=9.2.0",
    "yt-dlp>=2026.1.29",
    "click>=8.3.1",
]

[project.optional-dependencies]
elevenlabs = ["elevenlabs>=2.37.0"]
cartesia = ["cartesia>=1.3.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]
all = ["brainrot-generator[elevenlabs,cartesia,dev]"]

[project.scripts]
brainrot = "brainrot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
